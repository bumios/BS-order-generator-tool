<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BS Order Generator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <!-- nền bo góc -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- bảng tính: 3x3 ô -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="14" y="14" width="13" height="13" rx="2.5"/>
    <rect x="30" y="14" width="13" height="13" rx="2.5"/>
    <rect x="14" y="30" width="13" height="13" rx="2.5"/>
    <rect x="30" y="30" width="13" height="13" rx="2.5"/>
  </g>
  <!-- mũi tên xuống (tạo file) đè góc phải -->
  <g>
    <circle cx="46" cy="46" r="13" fill="#0f172a"/>
    <path d="M46 39v9M42 44l4 4 4-4" fill="none" stroke="#22c55e"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
